name: Render & deploy Quarto site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install minimal system libraries for R packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libglpk-dev libxml2-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          # pak otherwise tries to install Chromium via the xtradeb/apps PPA
          # for webshot2 (transitive dep of plotly). The PPA is flaky and not
          # actually needed — we render to HTML where plotly is interactive.
          # Whatever non-default libs the remaining packages need are
          # installed explicitly in the previous step.
          PKG_SYSREQS: "false"
        with:
          packages: |
            readr
            dplyr
            arules
            arulesViz
            ggplot2
            plotly
            rpart
            rpart.plot
            patchwork
            knitr
            reticulate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate synthetic dataset
        run: python scripts/generate_synthetic_data.py

      - name: Render Quarto site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
