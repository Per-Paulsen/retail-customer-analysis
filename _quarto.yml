      - href: 05-insights.qmd
        text: Insights
      - href: dashboard.html
        text: Dashboard
    right:
      - icon: github
        href: https://github.com/Per-Paulsen/retail-customer-analysis

format:
  html:
    theme: cosmo
    toc: true
    toc-location: left
    toc-depth: 2
    code-fold: show
    code-tools: true
    fig-width: 8
    fig-height: 5

execute:
  freeze: auto
  warning: false
  message: false
