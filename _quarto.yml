  site-url: "https://per-paulsen.github.io/retail-customer-analysis/"
  description: "End-to-end retail analytics portfolio: market basket, RFM, CLV, survival, forecasting, embeddings, causal uplift. By Per Paulsen."
  open-graph:
    title: "Retail Customer & Basket Analysis"
    description: "End-to-end retail analytics portfolio: market basket, RFM, CLV, survival, forecasting, embeddings, causal uplift. By Per Paulsen."
    image: "/og-image.png"
    image-width: 1200
    image-height: 630
    locale: en_US
  twitter-card:
    title: "Retail Customer & Basket Analysis"
    description: "End-to-end retail analytics portfolio: market basket, RFM, CLV, survival, forecasting, embeddings, causal uplift."
    image: "/og-image.png"
    card-style: summary_large_image
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: 00-data-audit.qmd
        text: Data Audit
      - text: Analyses
        menu:
          - href: 01-association.qmd
            text: Association Rules
          - href: 02-cluster-2d-bcg.qmd
            text: BCG Clustering
          - href: 03-cluster-3d-rfm.qmd
            text: RFM Clustering
          - href: 04-clv-bgnbd.qmd
            text: Customer Lifetime Value
          - href: 06-survival.qmd
            text: Survival (Time-to-Repeat)
          - href: 07-forecasting.qmd
            text: Demand Forecasting
          - href: 08-embeddings.qmd
            text: Product Embeddings
          - href: 09-causal-uplift.qmd
